[build-system]
# Build-time only. Nothing here is imported at runtime — see the CI gate,
# which distinguishes the two deliberately.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-letter-bridge"
version = "0.4.1"
description = "Message the CLI agents on your machine from your phone — every message becomes part of their memory."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]

# THIS LINE IS A SECURITY PROPERTY, NOT A PREFERENCE.
#
# The core holds a messaging token, so the audit a stranger performs before
# trusting it has to be finishable: clone it, read it, run it. Every dependency
# added is supply-chain surface in a token-holding daemon, and the moment the
# docs say "clone and inspect instead", the convenience of a package ecosystem
# has already been conceded.
#
# CI asserts this list stays empty. Do not add to it.
dependencies = []

[project.urls]
Homepage = "https://github.com/SimonMallas/agent-letter-bridge"
Repository = "https://github.com/SimonMallas/agent-letter-bridge"
Issues = "https://github.com/SimonMallas/agent-letter-bridge/issues"
Changelog = "https://github.com/SimonMallas/agent-letter-bridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Development only. Never imported by the shipped code, never a CI gate.
dev = ["ruff", "mypy"]

[project.scripts]
alb = "alb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alb"]

[tool.hatch.build.targets.sdist]
# A worktree's .git is a FILE; default directory exclusions do not protect it.
# Select public source roots rather than guessing every local scratch name.
only-include = [
    "src", "tests", "docs", "scripts", "examples", "vendor",
    "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "INSTALL.md",
    "SECURITY.md", "LICENSE", "pyproject.toml",
    ".github", ".githooks", ".gitignore",
]
