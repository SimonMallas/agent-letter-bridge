name: Publish to PyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'SimonMallas/agent-letter-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Pin the released source, not the branch that supplies this workflow.
      # Later releases require a deliberate change to this pin and version check.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0a243e5b2d8b166c1a5681e2018752d24c8d90eb # v0.4.3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify release identity
        run: |
          test "$(git rev-parse HEAD)" = 0a243e5b2d8b166c1a5681e2018752d24c8d90eb
          python -I -c 'import tomllib; from pathlib import Path; p = tomllib.loads(Path("pyproject.toml").read_text())["project"]; assert p["name"] == "agent-letter-bridge" and p["version"] == "0.4.3" and p["dependencies"] == []'
      - name: Build and check distributions
        run: |
          python -I -m pip install build==1.2.2.post1 twine==7.0.0 hatchling==1.27.0
          python -I -m build --no-isolation
          python -I -m twine check dist/*.whl dist/*.tar.gz
          python -I - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'dist/agent_letter_bridge-0.4.3-py3-none-any.whl': '585db40c7272bbd7fdb8672c91f90940fb651e69d55b17a1632c6b821e8be6b8',
              'dist/agent_letter_bridge-0.4.3.tar.gz': '47cb2a8c6b3595a1f4ffe723bb09726204f79d8362fe5ec7252a2210a8031ebf',
          }
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, f'checksum mismatch: {path}'
          PY
          sha256sum dist/*.whl dist/*.tar.gz
      - name: Smoke-test the built wheel without network dependencies
        run: |
          python -m venv "$RUNNER_TEMP/alb-smoke"
          "$RUNNER_TEMP/alb-smoke/bin/python" -I -m pip install --no-index --no-deps dist/*.whl
          test "$("$RUNNER_TEMP/alb-smoke/bin/python" -I -m alb --version)" = 'agent-letter-bridge 0.4.3'
          "$RUNNER_TEMP/alb-smoke/bin/python" -I -m alb --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agent-letter-bridge/
    permissions:
      id-token: write
    steps:
      # Never execute project build/install code in this credential-bearing job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true
