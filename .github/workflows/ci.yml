name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Runs on EVERY commit. A private repo's whole history becomes public if it
      # is ever flipped, so this is enforcement, not a pre-release checkpoint.
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py

      - name: Assert zero third-party runtime dependencies
        run: |
          for f in requirements.txt requirements-dev.txt pyproject.toml \
                   setup.py setup.cfg Pipfile Pipfile.lock poetry.lock uv.lock; do
            if [ -f "$f" ]; then
              echo "Dependency manifest $f present - core must stay stdlib-only." >&2
              exit 1
            fi
          done
          echo "no dependency manifest: core is stdlib-only"

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      # A test that still passes with an invariant disabled is coverage without
      # proof. This breaks each invariant in turn and asserts the suite goes red.
      - name: Mutation gate
        run: python3 scripts/mutation_check.py
